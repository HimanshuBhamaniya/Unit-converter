{% extends "base.html" %}

{% block content %}
<form method="POST" action="/length">
    <div class="form-group">
        <label for="value">Value to convert</label>
        <input type="text" id="value" name="value" value="{{ value }}" placeholder="Enter number..." required>
    </div>
    <div class="form-group">
        <label for="from_unit">From:</label>
        <select id="from_unit" name="from_unit">
            {% for unit in units %}
            <option value="{{ unit }}" {% if unit == from_unit %}selected{% endif %}>{{ unit.capitalize() }}</option>
            {% endfor %}
        </select>    
    </div>
<div class="form-group">
        <label for="to_unit">To:</label>
        <select id="to_unit" name="to_unit">
            {% for unit in units %}
                <option value="{{ unit }}" {% if unit == to_unit %}selected{% endif %}>{{ unit.capitalize() }}</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">Convert</button>
</form>

{% if result is not none %}
    <div class="result-box">
        <strong>Result:</strong> {{ value }} {{ from_unit }} = <strong>{{ result }} {{ to_unit }}</strong>
    </div>
{% endif %}

{% if error %}
    <div class="error-box">{{ error }}</div>
{% endif %}
{% endblock %}
