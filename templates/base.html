<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{category}} Converter - Unit Converter</title>
    <style>
        *{box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body{ background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 26px; }
        .card { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 480px; }
        h1 { margin-bottom: 20px; text-align: center; color: #333; font-size: 1.6rem; }
        nav { display: flex; justify-content: space-around; margin-bottom: 25px; border-bottom: 2px solid #eee; }
        nav a { text-decoration: none; color: #666; padding: 8px 12px; font-weight: 600; border-bottom: 3px solid transparent; }
        nav a.active { color: #007bff; border-bottom-color: #007bff; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #555; font-size: 0.9rem; font-weight: 600; }
        input[type="text"], select{ width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; margin-top: 10px; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        .result-box { margin-top: 20px; padding: 15px; background: #eef9f2; border: 1px solid #c3e6cb; color: #155724; border-radius: 6px; text-align: center; font-size: 1.1rem; }
        .error-box { margin-top: 20px; padding: 15px; background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Unit Converter</h1>
        <nav>
            <a href="/length" class="{% if category == 'Length' %}active{% endif %}">Length</a>
            <a href="/weight" class="{% if category == 'Weight' %}active{% endif %}">Weight</a>
            <a href="/temperature" class="{% if category == 'Temperature' %}active{% endif %}">Temperature</a>  
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
